name: compshare-keepalive

on:
  schedule:
    # 每天 4:00 AM 北京时间 (UTC+8) → 00:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:  # 支持手动触发
    inputs:
      only:
        description: '仅处理指定实例 ID（逗号分隔，留空=全部）'
        required: false
        default: ''
      dry_run:
        description: '只读巡检：仅打印各实例当前状态，不执行开关机'
        type: boolean
        required: false
        default: false

# 同一时间只保留一个 keepalive 运行，避免重复开关机互相干扰
concurrency:
  group: compshare-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run keepalive script
        env:
          COMPSHARE_PUBLIC_KEY: ${{ secrets.COMPSHARE_PUBLIC_KEY }}
          COMPSHARE_PRIVATE_KEY: ${{ secrets.COMPSHARE_PRIVATE_KEY }}
          # 脚本内部的硬预算必须小于 step 超时，保证能自行退出并打印摘要
          KEEPALIVE_GLOBAL_BUDGET_SEC: "900"
          KEEPALIVE_PER_INSTANCE_BUDGET_SEC: "540"
          # CompShare 无卡模式算力流有并发上限：并发启动会导致全部卡在
          # Initializing，因此保持串行（1）。确认平台已放宽后再调大。
          KEEPALIVE_MAX_WORKERS: "1"
        run: |
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then
            ARGS="$ARGS --only ${{ inputs.only }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/keepalive.py $ARGS
        timeout-minutes: 18
